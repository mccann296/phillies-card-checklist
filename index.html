<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Checklist">
<title>Card Checklist</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button id="backBtn" class="icon-btn" aria-label="Back" hidden>&#8249;</button>
  <h1 id="title">Card Checklist</h1>
  <button id="menuBtn" class="icon-btn" aria-label="Menu">&#8943;</button>
</header>
<main id="view" aria-live="polite"></main>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="fileInput" hidden>
<input type="file" id="photoInput" accept="image/*" hidden>
<script src="app.js"></script>
</body>
</html>
